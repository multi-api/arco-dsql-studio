[package]
name = "dsql-core"
description = "AWS, token, Postgres and SQL logic of Arco DSQL Studio, usable without Tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
aws-config = { version = "1.13.0", features = ["behavior-version-latest", "sso"] }
aws-sdk-dsql = "1.79.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
webpki-roots = "1.0.11"
