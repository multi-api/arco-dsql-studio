[package]
name = "dsql-core"
description = "AWS, token, Postgres and SQL logic of Arco DSQL Studio, usable without Tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aws-config = { version = "1.13.0", features = ["behavior-version-latest", "sso"] }
aws-credential-types = "1.3.1"
aws-sdk-dsql = "1.79.0"
aws-sdk-iam = "1.133.0"
aws-sdk-sso = "1.119.0"
aws-sdk-ssooidc = "1.121.0"
aws-sdk-sts = "1.124.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11.0"
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt", "time"] }

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
webpki-roots = "1.0.11"
