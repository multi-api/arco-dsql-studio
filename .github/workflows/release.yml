# Builds unsigned installers when a version tag (v0.1.0, ...) is pushed, and attaches them to a draft GitHub release.
# The owner reviews the draft and publishes it. See "Releases" in docs/development.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
            target: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
            target: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Arco DSQL Studio v__VERSION__
          releaseBody: |
            Unsigned builds. macOS: open the .dmg, drag the app to Applications, then the first time use
            System Settings → Privacy & Security → Open Anyway. Windows: SmartScreen may warn; click
            More info → Run anyway. See the README.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
